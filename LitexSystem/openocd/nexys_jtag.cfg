#---------------------------------------------------------------------------
# mmRISC-2 / mmRISC-3 on the Nexys Video : 4-wire JTAG with FT2232H
# (Dual RS232, 0403:6010), for an adapter without nSRST (step 2.4,
# LitexSystem/docs/BRINGUP.md 25)
#
#   Board: SW3 down (JTAG). SW2 up = authentication enabled (key 0xbeefcafe).
#
#   FT2232H channel A      Pmod JA
#     ADBUS0 TCK   ------> JA1 (AB22)
#     ADBUS1 TDI   ------> JA2 (AB21)
#     ADBUS2 TDO   <------ JA3 (AB20)
#     ADBUS3 TMS   ------> JA4 (AB18)
#     ACBUS0 nTRST ------> JA7 (Y21)   optional: driven high (released) only
#     (none)               JA8 (AA21)  nSRST: open, the FPGA's pull-up holds it
#     GND          ------- JA5
#
#   From mmRISC-2's FPGA/ARTY_A7_100T/openocd/ft2232h_jtag.cfg, but
#   reset_config none: no nSRST, and nTRST not relied on (the TAP is reset
#   through TMS). OpenOCD's reset / reset halt then reset the CPU through
#   the debug module's ndmreset, which in mmRISC-2 resets only the CPU, as
#   nSRST does (mmRISC-2 LitexSystem/docs/JTAG.md 2).
#
#   openocd -f openocd/nexys_jtag.cfg -f scripts/jtag_check.tcl   (from LitexSystem/)
#---------------------------------------------------------------------------

adapter driver ftdi
adapter speed 1000
ftdi device_desc "Dual RS232"
ftdi vid_pid 0x0403 0x6010
transport select jtag

# TCK, TDI, TMS (high) and ADBUS4 out as in mmRISC-2's configuration;
# ACBUS0 (nTRST) out and high, released; ACBUS1 (nSRST) left an input
ftdi layout_init 0x0908 0x091b

reset_config none

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x26d6d001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -endian little -chain-position $_TARGETNAME -coreid 0

riscv set_mem_access sysbus abstract
# physical addresses (OpenOCD does not walk the page tables unless asked)
riscv set_enable_virt2phys off

init

# Authentication, needed only when SW2 is up. The key is 0xbeefcafe; the
# environment variable AUTH_KEY replaces it (AUTH_KEY=0x12345678 to see a
# wrong key refused, AUTH_KEY=none to write nothing).
set _AUTH_KEY 0xbeefcafe
if {[info exists ::env(AUTH_KEY)]} { set _AUTH_KEY $::env(AUTH_KEY) }
if {$_AUTH_KEY ne "none"} {
    if {[catch {riscv authdata_write $_AUTH_KEY} err]} {
        echo "authdata_write: $err"
    }
}
