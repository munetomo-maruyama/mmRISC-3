#---------------------------------------------------------------------------
# mmRISC-2 / mmRISC-3 on the Nexys Video : 2-wire cJTAG (OScan1) with
# FT2232H, for an adapter without nSRST (step 2.4,
# LitexSystem/docs/BRINGUP.md 25)
#
#   Board: SW3 up (cJTAG). SW2 up = authentication enabled (key 0xbeefcafe).
#
#   The FT2232H 4-wire signals are converted to TCKC/TMSC by an external
#   cJTAG adapter (TMSC = TMSC_EN ? TDI : Hi-Z, TDO = TMSC), as with mmRISC-1.
#     TCKC -> JA1 (AB22)    TMSC <-> JA4 (AB18)    GND - JA5
#     JA8 (AA21) nSRST open: the FPGA's pull-up holds it
#
#   From mmRISC-2's FPGA/ARTY_A7_100T/openocd/ft2232h_cjtag.cfg, but
#   reset_config none (no nSRST): OpenOCD's reset / reset halt reset the CPU
#   through the debug module's ndmreset (only the CPU, as nSRST).
#
#   openocd -f openocd/nexys_cjtag.cfg -f scripts/jtag_check.tcl  (from LitexSystem/;
#   riscv-openocd with cJTAG support)
#---------------------------------------------------------------------------

adapter driver ftdi
adapter speed 1000
ftdi oscan1_mode on
ftdi device_desc "Dual RS232"
ftdi vid_pid 0x0403 0x6010
transport select jtag

# FT2232H channel A
#   ADBUS0 TCK, ADBUS1 TDI, ADBUS2 TDO, ADBUS3 TMS (used as TMSC_EN by the adapter)
#   ACBUS3 JTAG_SEL; ACBUS1 (nSRST in mmRISC-2's configuration) left an input
ftdi layout_init 0x0808 0x091b
ftdi layout_signal JTAG_SEL -data 0x0800
ftdi layout_signal TCK      -data 0x0001
ftdi layout_signal TDI      -data 0x0002
ftdi layout_signal TDO      -input 0x0004
ftdi layout_signal TMS      -data 0x0008

reset_config none

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x26d6d001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -endian little -chain-position $_TARGETNAME -coreid 0
riscv set_mem_access sysbus abstract
# physical addresses (OpenOCD does not walk the page tables unless asked)
riscv set_enable_virt2phys off

init

# Authentication, needed only when SW2 is up. The key is 0xbeefcafe; the
# environment variable AUTH_KEY replaces it (AUTH_KEY=0x12345678 to see a
# wrong key refused, AUTH_KEY=none to write nothing).
set _AUTH_KEY 0xbeefcafe
if {[info exists ::env(AUTH_KEY)]} { set _AUTH_KEY $::env(AUTH_KEY) }
if {$_AUTH_KEY ne "none"} {
    if {[catch {riscv authdata_write $_AUTH_KEY} err]} {
        echo "authdata_write: $err"
    }
}
